server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Same-origin API, so the browser never needs CORS and the demo works with no network.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
