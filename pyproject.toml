[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "setubiz"
version = "0.1.0"
description = "AI-driven hyper-local business advisory and financial structuring assistant for rural micro-entrepreneurs (SIH26091)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "rapidfuzz>=3.10",
    "typer>=0.15",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
]
llm = ["anthropic>=0.40"]
# The offline narration lane. Deliberately not a default: llama-cpp-python compiles native code,
# which would make `make setup` slow and fragile on the machines this has to run on.
local = ["llama-cpp-python>=0.3"]

[project.scripts]
setubiz = "setubiz.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["backend/setubiz"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.coverage.run]
source = ["setubiz.finance", "setubiz.eligibility"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# UP042: `str, Enum` is deliberate — it keeps JSON serialization stable on 3.11 without StrEnum.
# RUF001-003: the codebase is bilingual; Devanagari and typographic dashes are not "ambiguous".
ignore = ["RUF001", "RUF002", "RUF003", "UP042"]

[tool.mypy]
python_version = "3.11"
mypy_path = "backend"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
