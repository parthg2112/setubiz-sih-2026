[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "setubiz"
version = "0.1.0"
description = "AI-driven hyper-local business advisory and financial structuring assistant for rural micro-entrepreneurs (SIH26091)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "rapidfuzz>=3.10",
    "typer>=0.15",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
]
llm = ["anthropic>=0.40"]

[project.scripts]
setubiz = "setubiz.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["backend/setubiz"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.coverage.run]
source = ["setubiz.finance", "setubiz.eligibility"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
mypy_path = "backend"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
