services:
  api:
    build: .
    environment:
      # The demo runs on the committed sample data — no network, no keys, no failure mode.
      SETUBIZ_LLM_ENABLED: "0"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"

