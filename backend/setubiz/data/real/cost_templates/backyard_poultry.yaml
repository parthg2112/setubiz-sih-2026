assumptions:
  - 5 batches/year of 500 birds; monthly figures are the annual total ÷ 12.
  - Broiler rates swing sharply; the seasonality index in the threats section applies here.
  - Sized in birds per batch. Shed cost follows floor area; feeders and drinkers are bought as sets for 500 birds.
  - This template carries no labour line, so its surplus is not net of what the household draws and no phased expansion is offered from it.
