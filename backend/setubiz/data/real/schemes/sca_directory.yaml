# State Channelizing Agencies: the actual counter a beneficiary walks into.
# NSFDC/NSKFDC/NBCFDC do not lend directly; they on-lend through these bodies (PLAN.md §0.1).
# Sample subset for the pilot geography; the real directory comes from the corporation portals.

agencies:
